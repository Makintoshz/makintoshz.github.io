<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makintoshz</title>
<meta name="description" content="Makintoshz - تطبيقات آيفون">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--text:#eceef4;--muted:#8b90a0;--a1:#7c5cff;--a2:#22d3ee}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.7}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px 400px at 80% -10%,rgba(124,92,255,.25),transparent 70%),radial-gradient(500px 400px at 0% 100%,rgba(34,211,238,.15),transparent 70%)}
.grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);opacity:.35}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;direction:ltr}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-size:18px;color:#fff;box-shadow:0 6px 24px rgba(124,92,255,.45)}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:6px 14px;border-radius:999px;background:var(--card)}
.pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-inline-end:6px;box-shadow:0 0 10px #22c55e}
.hero{text-align:center;padding:90px 0 70px}
.hero h1{font-size:clamp(38px,7vw,68px);font-weight:700;line-height:1.2;margin-bottom:18px}
.grad{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:clamp(16px,2.2vw,19px);max-width:560px;margin:0 auto 34px}
.tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tag{direction:ltr;font-size:14px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px)}
section{padding:40px 0}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.head h2{font-size:22px;font-weight:600}
.head span{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{border:1px dashed var(--line);border-radius:20px;padding:28px;background:var(--card);min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;color:var(--muted);transition:.3s}
.card:hover{border-color:rgba(124,92,255,.5);transform:translateY(-3px)}
.card .ic{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;opacity:.7}
.card b{color:var(--text);font-weight:600}
footer{text-align:center;color:var(--muted);font-size:14px;padding:60px 0 40px;border-top:1px solid var(--line);margin-top:50px}
footer a{color:var(--text);text-decoration:none;direction:ltr;display:inline-block}
.fade{opacity:0;transform:translateY(16px);animation:up .8s ease forwards}
.d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.45s}
@keyframes up{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <nav class="fade">
    <div class="logo"><div class="logo-mark">M</div>Makintoshz</div>
    <div class="pill"><span class="dot"></span>أشتغل على شي جديد</div>
  </nav>

  <header class="hero">
    <h1 class="fade d2">أبني تطبيقات <span class="grad">آيفون</span><br>بسيطة وجميلة</h1>
    <p class="fade d3">مطوّر تطبيقات iOS. هنا تلقى كل تطبيقاتي ومشاريعي في مكان واحد.</p>
    <div class="tags fade d4">
      <span class="tag">iOS</span><span class="tag">Flutter</span><span class="tag">Dart</span><span class="tag">Swift</span>
    </div>
  </header>

  <section class="fade d4">
    <div class="head"><h2>التطبيقات</h2><span>قريباً</span></div>
    <div class="cards" id="apps">
      <div class="card"><div class="ic">✦</div><b>أول تطبيق في الطريق</b>تابعني، قريباً بيكون هنا</div>
    </div>
  </section>

  <footer>
    <a href="https://github.com/Makintoshz">github.com/Makintoshz</a>
    <div style="margin-top:8px">© <span id="y"></span> Makintoshz</div>
  </footer>
</div>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
